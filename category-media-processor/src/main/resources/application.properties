spring.application.name=category-media-processor
spring.main.web-application-type=none

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:festhub}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:festhubpass}
spring.rabbitmq.listener.simple.concurrency=${CATEGORY_MEDIA_MIN_CONCURRENCY:3}
spring.rabbitmq.listener.simple.max-concurrency=${CATEGORY_MEDIA_MAX_CONCURRENCY:8}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=5000
spring.rabbitmq.listener.simple.default-requeue-rejected=false

festhub.category-media.queue=category-media.inbound.q

services.category.url=${BOOKING_CATEGORY_SERVICE_URL:http://booking-category:8080}
services.concert.url=${CONCERT_EVENT_SERVICE_URL:http://concert-event:8080}
services.media.url=${PROMO_MEDIA_SERVICE_URL:http://promo-media:8080}
