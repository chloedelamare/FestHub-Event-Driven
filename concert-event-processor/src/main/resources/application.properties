spring.application.name=concert-event-processor
spring.main.web-application-type=none

spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:festhub}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:festhubpass}

spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

festhub.concert.queue=concert.inbound.q
festhub.concert.exchange=festhub.events
festhub.concert.routing-key=concert.scheduled

services.concert.url=${CONCERT_EVENT_SERVICE_URL:http://concert-event:8080}